name: CI
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B verify
        working-directory: backend
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start containers
        run: docker compose up -d --build
      - name: Verify task flow
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/api/templates > /tmp/templates.json; then break; fi
            sleep 2
          done
          python3 -c 'import json; assert len(json.load(open("/tmp/templates.json"))) >= 1'
          echo 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/qZkAAAAASUVORK5CYII=' | base64 -d > /tmp/sample.png
          curl -fsS -H 'X-User: demo-a' -F 'templateId=pet' -F 'files=@/tmp/sample.png;type=image/png' http://localhost:3000/api/tasks > /tmp/task.json
          TASK_ID=$(python3 -c 'import json; print(json.load(open("/tmp/task.json"))["id"])')
          for i in $(seq 1 30); do
            curl -fsS -H 'X-User: demo-a' "http://localhost:3000/api/tasks/$TASK_ID" > /tmp/result.json
            if python3 -c 'import json,sys; sys.exit(0 if json.load(open("/tmp/result.json"))["status"] == "SUCCESS" else 1)'; then break; fi
            sleep 2
          done
          python3 -c 'import json; r=json.load(open("/tmp/result.json")); assert r["status"] == "SUCCESS" and r["resultUrl"]'
          RESULT_URL=$(python3 -c 'import json; print(json.load(open("/tmp/result.json"))["resultUrl"])')
          curl -fsS "http://localhost:3000$RESULT_URL" -o /dev/null
      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down -v
