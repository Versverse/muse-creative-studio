spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/studio?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USER:studio}
    password: ${DB_PASSWORD:studio}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 12MB
mybatis:
  configuration:
    map-underscore-to-camel-case: true
studio:
  upload-dir: ${UPLOAD_DIR:./data/uploads}
  step-ms: ${STEP_MS:3000}
  fail-stage: ${FAIL_STAGE:NONE}

server:
  error:
    include-message: always
